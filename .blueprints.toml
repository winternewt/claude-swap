[repo]
id = "claude-swap"
# The kit's consensus runs (three-leaf, four-leaf, consensus) send no copy of this repo to an outside
# model, even when the person types one (docs/TRUST.md, the seats kit row; kit v0.1.88 repo-prep).
outside = "never"

[seat.downstream]

[seat.downstream.zulip]
pool = "~/.config/agent-seat-blueprints/zulip/pool"

# The kit's releases, and a pin moved from outside (docs/TRUST.md, the kit's threat model).
[seat.downstream.watch.kit]
cmd = "python3 scripts/kittrack.py watch"
